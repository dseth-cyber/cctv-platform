global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "image-api"
    scrape_interval: 15s
    metrics_path: /api/v1/metrics
    # /metrics answers only with the service key (or a signed-in person who sees all cameras).
    # Prometheus 3 and later can send the key from a file kept out of this repo:
    # http_headers:
    #   x-service-api-key:
    #     files: [/etc/prometheus/service-api-key]
    static_configs:
      - targets: ["image-api:3001"]
