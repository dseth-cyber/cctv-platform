# MediaMTX Configuration — CCTV Platform Media Plane
# Pass-through streaming with zero transcoding by default.

# ── General & Logging ──────────────────────────────────────────
logLevel: info
logDestinations: [stdout]

# ── Authentication & Media Access Control ───────────────────────
authMethod: http
authHTTPAddress: http://image-api:3001/api/v1/media/auth


# ── API Management (Internal / Localhost) ──────────────────────
api: yes
apiAddress: 0.0.0.0:9997

# ── Playback Server (recorded segments, auth action "playback") ──
# Reached by browsers only through nginx /mediamtx/playback/; port is not published.
playback: yes
playbackAddress: 0.0.0.0:9996

# ── Metrics (Prometheus) ───────────────────────────────────────
metrics: yes
metricsAddress: 0.0.0.0:9998

# ── RTSP Server ────────────────────────────────────────────────
rtsp: yes
rtspAddress: 0.0.0.0:8554
rtspTransports: [tcp]
rtspEncryption: "no"

# ── WebRTC Server (WHEP / WHIP) ────────────────────────────────
webrtc: yes
webrtcAddress: 0.0.0.0:8889
webrtcLocalUDPAddress: 0.0.0.0:8189
webrtcAllowOrigins: ["*"]

# ── HLS Server (Low-Latency Fallback) ──────────────────────────
hls: yes
hlsAddress: 0.0.0.0:8888
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ["*"]

# ── Recording Defaults ──────────────────────────────────────────
# Direct fMP4 remux on media node with zero CPU transcoding
pathDefaults:
  record: yes
  # %f is required by the playback server; the indexer parses it as microseconds.
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s
  # Never let MediaMTX delete recordings itself (its default is 1d): it would bypass the retention
  # policy, Legal Hold and quarantine. image-api retention is the only thing that removes segments.
  recordDeleteAfter: 0s
  # Event-Driven Real-time Camera Health Webhook (< 3s Detection) [ENH-01]
  runOnReady: 'wget -q -O - --header "Content-Type: application/json" --header "x-media-webhook-secret: $MEDIA_WEBHOOK_SECRET" --post-data "{\"path\":\"$MTX_PATH\",\"status\":\"ready\"}" http://image-api:3001/api/v1/media/events/stream-status'
  runOnNotReady: 'wget -q -O - --header "Content-Type: application/json" --header "x-media-webhook-secret: $MEDIA_WEBHOOK_SECRET" --post-data "{\"path\":\"$MTX_PATH\",\"status\":\"not_ready\"}" http://image-api:3001/api/v1/media/events/stream-status'
  # Recording index [R3.1]: report every finished segment to image-api
  runOnRecordSegmentComplete: 'wget -q -O - --header "Content-Type: application/json" --header "x-media-webhook-secret: $MEDIA_WEBHOOK_SECRET" --post-data "{\"path\":\"$MTX_PATH\",\"segmentPath\":\"$MTX_SEGMENT_PATH\"}" http://image-api:3001/api/v1/media/events/segment-complete'


# ── Stream Paths ───────────────────────────────────────────────
paths:
  # Built-in Dev Simulator Streams (On-demand test pattern with timer)
  # `source: publisher` must be explicit on runOnDemand paths: MediaMTX re-validates the whole config on
  # every API change, and without it every camera path the API adds is refused with
  # "'runOnDemand' and 'runOnUnDemand' can be used only when source is 'publisher'".
  sim/ch1:
    source: publisher
    runOnDemand: ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=1000:sample_rate=44100 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -c:a aac -f rtsp rtsp://localhost:8554/sim/ch1
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
    record: yes

  sim/ch2:
    source: publisher
    runOnDemand: ffmpeg -re -f lavfi -i smptebars=size=1280x720:rate=25 -f lavfi -i sine=frequency=800:sample_rate=44100 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -c:a aac -f rtsp rtsp://localhost:8554/sim/ch2
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
    record: yes

  # Default policy for dynamically added camera streams
  all_others:
    maxReaders: 50
    record: yes

