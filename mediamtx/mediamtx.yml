# MediaMTX Configuration — CCTV Platform Media Plane
# Pass-through streaming with zero transcoding by default.

# ── General & Logging ──────────────────────────────────────────
logLevel: info
logDestinations: [stdout]

# ── Authentication & Media Access Control ───────────────────────
authMethod: http
authHTTPAddress: http://image-api:3001/api/v1/media/auth


# ── API Management (Internal / Localhost) ──────────────────────
api: yes
apiAddress: 0.0.0.0:9997

# ── Metrics (Prometheus) ───────────────────────────────────────
metrics: yes
metricsAddress: 0.0.0.0:9998

# ── RTSP Server ────────────────────────────────────────────────
rtsp: yes
rtspAddress: 0.0.0.0:8554
rtspTransports: [tcp]
rtspEncryption: "no"

# ── WebRTC Server (WHEP / WHIP) ────────────────────────────────
webrtc: yes
webrtcAddress: 0.0.0.0:8889
webrtcLocalUDPAddress: 0.0.0.0:8189
webrtcAllowOrigins: ["*"]

# ── HLS Server (Low-Latency Fallback) ──────────────────────────
hls: yes
hlsAddress: 0.0.0.0:8888
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ["*"]

# ── Recording Defaults ──────────────────────────────────────────
# Direct fMP4 remux on media node with zero CPU transcoding
record: yes
recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 60s
recordDeleteAfter: 7d

# ── Stream Paths ───────────────────────────────────────────────
paths:
  # Built-in Dev Simulator Streams (On-demand test pattern with timer)
  sim/ch1:
    runOnDemand: ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25 -f lavfi -i sine=frequency=1000:sample_rate=44100 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -c:a aac -f rtsp rtsp://localhost:8554/sim/ch1
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
    record: yes

  sim/ch2:
    runOnDemand: ffmpeg -re -f lavfi -i smptebars=size=1280x720:rate=25 -f lavfi -i sine=frequency=800:sample_rate=44100 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -c:a aac -f rtsp rtsp://localhost:8554/sim/ch2
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
    record: yes

  # Default policy for dynamically added camera streams
  all_others:
    # sourceOnDemand: pulls stream from RTSP source ONLY when someone watches
    # This prevents idle network overload for 200+ channels.
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 15s
    maxReaders: 50
    record: yes
