services:
  # ── Infrastructure ──────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cctv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-image_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_pass}
      POSTGRES_DB: ${POSTGRES_DB:-image_db}
    ports:
      # Localhost-only — nothing outside the docker network needs direct DB access;
      # app containers reach it via the internal "postgres" hostname regardless.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-image_user} -d ${POSTGRES_DB:-image_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cctv-network

  redis:
    image: redis:7-alpine
    container_name: cctv-redis
    command: redis-server --appendonly yes
    ports:
      # Localhost-only — Redis reached via internal "redis" hostname
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cctv-network

  # MinIO is optional and off: its images left Docker Hub (only machines that already have them can start it),
  # and CCTV stores nothing in it; storage is the local disk (local-storage-data). Start it only on purpose:
  # docker compose --profile minio up -d
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: cctv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # Localhost-only — inactive storage provider (SeaweedFS is default)
      - "127.0.0.1:9500:9000"
      - "127.0.0.1:9501:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cctv-network

  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    container_name: cctv-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb local/${MINIO_BUCKET:-image-service} --ignore-existing
      "
    networks:
      - cctv-network

  # ── Time for the recorders (NTP) ────────────────────────────────
  # DVR/NVRs pointed here keep their clocks right. Bound to localhost unless NTP_BIND names the
  # camera LAN address (never the production LAN). Open UDP 123 from the camera LAN on the host firewall.
  ntp-server:
    build: ./ntp
    container_name: cctv-ntp
    restart: unless-stopped
    ports:
      - "${NTP_BIND:-127.0.0.1}:123:123/udp"
    environment:
      NTP_UPSTREAM: ${NTP_UPSTREAM:-th.pool.ntp.org,pool.ntp.org}
      NTP_ALLOW: ${NTP_ALLOW:-all}
    networks:
      - cctv-network

  # ── Media Plane (MediaMTX — RTSP/WebRTC/HLS) ────────────────────

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: cctv-mediamtx
    # Same uid as image-api (appuser 1001), so retention can move segments MediaMTX wrote into quarantine.
    user: "1001:1001"
    ports:
      # Localhost bindings for dev stream preview and control
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      # WebRTC media (UDP). MEDIA_UDP_BIND=<LAN IP> lets browsers on the LAN receive live video.
      - "${MEDIA_UDP_BIND:-127.0.0.1}:8189:8189/udp"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/recordings:/recordings
    environment:
      # Sent by runOnReady/runOnNotReady hooks; must match image-api's value or the webhook gets 401
      MEDIA_WEBHOOK_SECRET: ${MEDIA_WEBHOOK_SECRET:-dev-media-webhook-secret-change-in-production}
      # Extra address MediaMTX offers as a WebRTC candidate (the LAN IP when serving LAN browsers).
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_WEBRTC_HOST:-}
    restart: unless-stopped
    networks:
      - cctv-network

  # ── SeaweedFS (S3-compatible distributed storage) ───────────────

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: cctv-seaweedfs-master
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/dir/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cctv-network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: cctv-seaweedfs-volume
    command: volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080 -max=300
    volumes:
      - seaweedfs-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cctv-network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: cctv-seaweedfs-filer
    command: filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      # Localhost-only — S3 API backend
      - "127.0.0.1:8333:8333"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cctv-network

  seaweedfs-init:
    image: minio/mc:latest
    container_name: cctv-seaweedfs-init
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set seaweed http://seaweedfs-filer:8333 ${SEAWEEDFS_ACCESS_KEY:-seaweedadmin} ${SEAWEEDFS_SECRET_KEY:-seaweedadmin} &&
      mc mb seaweed/${SEAWEEDFS_BUCKET:-image-service} --ignore-existing
      "
    networks:
      - cctv-network

  # ── SMB Server (simulated camera SMB share) ────────────────────

  # ── Image API ──────────────────────────────────────────────────

  image-api-migrate:
    image: cctv-api:latest
    build:
      context: ./image-api
      dockerfile: Dockerfile
    container_name: cctv-api-migrate
    entrypoint: ["/app/docker-entrypoint.sh", "migrate"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-image_user}:${POSTGRES_PASSWORD:-image_pass}@postgres:5432/${POSTGRES_DB:-image_db}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32chars!!}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-api-key-change-in-production}
      LOG_LEVEL: info
      ALLOW_DATA_LOSS: ${ALLOW_DATA_LOSS:-false}
      RUN_SEED: ${RUN_SEED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cctv-network

  image-api:
    image: cctv-api:latest
    build:
      context: ./image-api
      dockerfile: Dockerfile
    container_name: cctv-api
    ports:
      # Localhost-only — the web app reaches this via nginx's internal proxy to the
      # "image-api" hostname (see web-app/nginx.conf), never the published host port.
      - "127.0.0.1:3001:3001"
    volumes:
      - local-storage-data:/data/images
      - incident-attachments-data:/app/incident-attachments
      - backup-data:/app/backups
      - ./host-storage:/mnt/host-storage
      # Same path as inside mediamtx so indexed segment paths resolve in both containers,
      # and the disk watermark monitor measures the filesystem that actually holds video [R1.7]
      - ./mediamtx/recordings:/recordings
    environment:
      NODE_ENV: production
      RECORDINGS_DIR: /recordings
      # Recording cleanup stays off until a retention policy is approved (AGENTS.md); when on, files move to quarantine
      RECORDINGS_CLEANUP_ENABLED: ${RECORDINGS_CLEANUP_ENABLED:-true}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
      RECORDINGS_QUARANTINE_PURGE_DAYS: ${RECORDINGS_QUARANTINE_PURGE_DAYS:-7}
      RECORDINGS_QUARANTINE_DIR: ${RECORDINGS_QUARANTINE_DIR:-/recordings/.quarantine}
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-image_user}:${POSTGRES_PASSWORD:-image_pass}@postgres:5432/${POSTGRES_DB:-image_db}?connection_limit=50&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-image-service}
      MINIO_USE_SSL: "false"
      LOCAL_STORAGE_PATH: /data/images
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32chars!!}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-api-key-change-in-production}
      MEDIA_WEBHOOK_SECRET: ${MEDIA_WEBHOOK_SECRET:-dev-media-webhook-secret-change-in-production}
      LOG_LEVEL: info
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:-}
      # image-api reaches the MediaMTX control API over the compose network (not its own localhost).
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      # Set to true in .env only after confirming this host cannot reach legacy Image Service production.
      CCTV_ISOLATION_VERIFIED: ${CCTV_ISOLATION_VERIFIED:-false}
      # Which installation this is. The production server sets DEPLOY_ENV=production, and then image-api refuses to
      # start on Dev/default secrets (src/config/production-guard.ts). Unset = the Dev machine.
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
      # Address people open the system at; used in links inside alerts and notifications.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Proxies in front of image-api whose client address is trusted (nginx = 1).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DISK_WARNING_THRESHOLD_PCT: ${DISK_WARNING_THRESHOLD_PCT:-85}
      DISK_CRITICAL_THRESHOLD_PCT: ${DISK_CRITICAL_THRESHOLD_PCT:-92}
      MAX_CONCURRENT_EXPORTS: ${MAX_CONCURRENT_EXPORTS:-2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${WEB_HTTP_PORT:-8080},https://localhost:${WEB_HTTPS_PORT:-8443},http://127.0.0.1:${WEB_HTTP_PORT:-8080},https://127.0.0.1:${WEB_HTTPS_PORT:-8443}}
    depends_on:
      image-api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - cctv-network

  # ── Image Sync Worker (SMB scanner + BullMQ producer) ──────────

  # ── Kafka (Event Streaming for ERP Integration) ─────────────────

  # ── Consumer Stubs (ERP Integration) ────────────────────────────

  # ── Image Processing Worker (TIFF→PNG converter + MinIO) ───────

  # ── Web App (React Frontend) ────────────────────────────────────

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: cctv-web-app
    ports:
      # Localhost-only in Dev to avoid exposing ports to the entire LAN
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${WEB_HTTPS_PORT:-8443}:443"
      # Optional LAN access on ONE chosen address (WEB_LAN_ADDRESS in .env). The defaults only add
      # extra localhost ports; never bind 0.0.0.0, and never the legacy Image Service subnet.
      - "${WEB_LAN_ADDRESS:-127.0.0.1}:${WEB_LAN_HTTP_PORT:-8081}:80"
      - "${WEB_LAN_ADDRESS:-127.0.0.1}:${WEB_LAN_HTTPS_PORT:-8444}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - image-api
    restart: unless-stopped
    networks:
      - cctv-network

  # ── Observability (Prometheus + Grafana + Loki) ─────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: cctv-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - cctv-network

  grafana:
    image: grafana/grafana:latest
    container_name: cctv-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-image-renderer
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GF_RENDERER_TOKEN:-changeme-renderer-token}
    depends_on:
      - prometheus
      - loki
      - grafana-renderer
    restart: unless-stopped
    networks:
      - cctv-network

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: cctv-grafana-renderer
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ENABLE_METRICS: "true"
      AUTH_TOKEN: ${GF_RENDERER_TOKEN:-changeme-renderer-token}
    restart: unless-stopped
    networks:
      - cctv-network

  loki:
    image: grafana/loki:latest
    container_name: cctv-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - cctv-network

  # ── Cloudflare Tunnel (Disabled by default in Dev) ──────────────
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: cctv-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - web-app
    networks:
      - cctv-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  local-storage-data:
  seaweedfs-data:
  prometheus-data:
  grafana-data:
  loki-data:
  incident-attachments-data:
  backup-data:

networks:
  cctv-network:
    driver: bridge
